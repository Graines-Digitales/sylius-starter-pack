# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
imports:
    - { resource: project.yaml }
    
parameters:
    locale: fr
    sylius_installer_currency: EUR
    developers: [ 'johan.remy@graines-digitales.online' ]
    directory_image_media_object: /media/image
    directory_document_media_object: /media/document
    directory_icon_media_object: /media/icon
    path_directory_resources: "%env(PATH_DIRECTORY_RESOURCES)%"
    folder_images_upload: "%env(FOLDER_IMAGES_UPLOAD)%"
    directory_cache_prefix: media/cache/resolve
    path_directory_media: '%kernel.project_dir%/public/media/image'
    path_directory_icon: '%kernel.project_dir%/public/media/icon'
    sendinblue_api_key: '%env(resolve:SENDINBLUE_API_KEY)%'
    sendinblue_list_newsletter_id: '%env(resolve:SENDINBLUE_LIST_NEWSLETTER_ID)%'
    google_cloud_api_key: '%env(resolve:GOOGLE_CLOUD_API_KEY)%'
    image_cdn: '%env(resolve:IMAGE_CDN)%'
    website_host: '%env(resolve:WEBSITE_HOST)%'
    website_directory: '%env(resolve:WEBISTE_DIRECTORY)%'
    shop_id: '%env(resolve:SHOP_ID)%'
    shop_testing_key: '%env(resolve:SHOP_TESTING_KEY)%'
    shop_production_key: '%env(resolve:SHOP_PRODUCTION_KEY)%'
    shop_context_mode: '%env(resolve:SHOP_CONTEXT_MODE)%'
    shop_platform_url: '%env(resolve:SHOP_PLATFORM_URL)%'