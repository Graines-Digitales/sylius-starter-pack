                code: component_documents
                template:
                    default:
                        name: Défaut
                        code: component_document_default
            component_hero:
                name: Composant Hero
                code: component_hero
                template:
                    default:
                        name: Défaut
                        code: component_hero_default
            component_iframe:
                name: Composant Iframe
                code: component_iframe
                template:
                    default:
                        name: Défaut
                        code: component_iframe_default
            component_link:
                name: Composant Lien - Bouton
                code: component_link
                template:
                    default:
                        name: Défaut
                        code: component_link_default
            component_slider:
                name: Composant Slider
