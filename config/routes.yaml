app_nuxt_build:
    path: /nuxt/build
    methods: [POST]
    defaults:
        _controller: app.controller.nuxt::build

app_nuxt_fetch:
    path: /nuxt/fetch
    methods: [POST]
    defaults:
        _controller: app.controller.nuxt::fetch

app_admin_travel_duplicate:
    path: /admin/travel/{id}/duplicate
    methods: [GET]
    defaults:
        _controller: app.controller.travel::duplicateAction

