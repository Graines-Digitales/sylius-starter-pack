sylius_paypal_webhook:
    resource: "@SyliusPayPalPlugin/Resources/config/webhook_routing.yaml"

app_schema_constraints_from_form_type:
    path: /schema/constraints/form/{form}
    methods: [GET,POST]
    defaults:
        _controller: app.controller.schema::constraintsFromFormType

app_schema_constraints_from_entity:
    path: /schema/constraints/entity/{entity}
    methods: [GET,POST]
    defaults:
        _controller: app.controller.schema::constraintsFromEntity

app_schema_save_form_contact:
    path: /schema/save/form/message
    methods: [POST]
    defaults:
        _controller: app.controller.schema::saveFormMessage

