sylius_admin:
    resource: "@SyliusAdminBundle/Resources/config/routing.yml"
    prefix: '/%sylius_admin.path_name%'
    
sylius_paypal_admin:
    resource: "@SyliusPayPalPlugin/Resources/config/admin_routing.yml"
    prefix: '/%sylius_admin.path_name%'

# APP Custom routes
app_admin_web_page:
    resource: |
        alias: app.web_page
        section: admin
        templates: "@SyliusAdmin\\Crud"
        redirect: update
        grid: app_admin_web_page
        vars:
            all:
                subheader: app.ui.web_page
                templates:
                       form: "@App/admin/form/WebPage/views/_form.html.twig"
            index:
                icon: 'edit outline'
    type: sylius.resource
    prefix: /admin

