                    options:
                        template: "@SyliusUi/Grid/Field/enabled.html.twig"
                is_locked:
                    type: twig
                    label: app.ui_element.field.is_locked
                    options:
                        template: "@App/admin/Grid/Field/locked.html.twig"
                primaryImage:
                    type: twig
                    label: app.ui.primary_image
                    options:
                        template: "@App/admin/Grid/Field/thumbnail.html.twig"
                # category:
                #     type: twig # Type of filter
