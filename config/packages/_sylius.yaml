                #     sortable: translation.meta_title
                # translation.meta_description:
                #     type: string
                #     label: app.ui.meta_description
                #     sortable: translation.meta_description
            filters:
                search:
                    type: string
                    label: false
                    options:
                        fields: [translations.headline, code]
                    form_options:
                        type: contains
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete

