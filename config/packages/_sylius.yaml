imports:
    - { resource: "@SyliusCoreBundle/Resources/config/app/config.yml" }

    - { resource: "@SyliusAdminBundle/Resources/config/app/config.yml" }
    - { resource: "@SyliusApiBundle/Resources/config/app/config.yaml" }

    - { resource: "@SyliusShopBundle/Resources/config/app/config.yml" }
    - { resource: "@SyliusPayPalPlugin/Resources/config/config.yaml" }

parameters:
    sylius_core.public_dir: '%kernel.project_dir%/public'

sylius_addressing:
    resources:
        address:
            classes:
                model: App\Entity\Addressing\Address
        country:
            classes:
                model: App\Entity\Addressing\Country
        province:
            classes:
                model: App\Entity\Addressing\Province
        zone:
            classes:
                model: App\Entity\Addressing\Zone
        zone_member:
            classes:
                model: App\Entity\Addressing\ZoneMember

sylius_attribute:
    resources:
        product:
            attribute:
                classes:
                    model: App\Entity\Product\ProductAttribute
                translation:
                    classes:
                        model: App\Entity\Product\ProductAttributeTranslation
            attribute_value:
                classes:
                    model: App\Entity\Product\ProductAttributeValue

sylius_channel:
    resources:
        channel:
            classes:
                model: App\Entity\Channel\Channel
sylius_core:
    resources:
        product_image:
            classes:
                model: App\Entity\Product\ProductImage
        taxon_image:
            classes:
                model: App\Entity\Taxonomy\TaxonImage
        product_taxon:
            classes:
                model: App\Entity\Product\ProductTaxon
        channel_pricing:
            classes:
                model: App\Entity\Channel\ChannelPricing

sylius_currency:
    resources:
        currency:
            classes:
                model: App\Entity\Currency\Currency
        exchange_rate:
            classes:
                model: App\Entity\Currency\ExchangeRate

sylius_customer:
    resources:
        customer:
            classes:
                model: App\Entity\Customer\Customer
        customer_group:
            classes:
                model: App\Entity\Customer\CustomerGroup

sylius_locale:
    locale: "%locale%"
    resources:
        locale:
            classes:
                model: App\Entity\Locale\Locale

sylius_order:
    resources:
        order:
            classes:
                model: App\Entity\Order\Order
        order_item:
            classes:
                model: App\Entity\Order\OrderItem
        order_item_unit:
            classes:
                model: App\Entity\Order\OrderItemUnit
        adjustment:
            classes:
                model: App\Entity\Order\Adjustment
        order_sequence:
            classes:
                model: App\Entity\Order\OrderSequence

sylius_payment:
    resources:
        payment_method:
            classes:
                model: App\Entity\Payment\PaymentMethod
            translation:
                classes:
                    model: App\Entity\Payment\PaymentMethodTranslation
        payment:
            classes:
                model: App\Entity\Payment\Payment

sylius_payum:
    resources:
        payment_security_token:
            classes:
                model: App\Entity\Payment\PaymentSecurityToken
        gateway_config:
            classes:
                model: App\Entity\Payment\GatewayConfig

sylius_product:
    resources:
        product:
            classes:
                model: App\Entity\Product\Product
            translation:
                classes:
                    model: App\Entity\Product\ProductTranslation
        product_variant:
            classes:
                model: App\Entity\Product\ProductVariant
            translation:
                classes:
                    model: App\Entity\Product\ProductVariantTranslation
        product_option:
            classes:
                model: App\Entity\Product\ProductOption
            translation:
                classes:
                    model: App\Entity\Product\ProductOptionTranslation
        product_option_value:
            classes:
                model: App\Entity\Product\ProductOptionValue
            translation:
                classes:
                    model: App\Entity\Product\ProductOptionValueTranslation
        product_association:
            classes:
                model: App\Entity\Product\ProductAssociation
        product_association_type:
            classes:
                model: App\Entity\Product\ProductAssociationType
            translation:
                classes:
                    model: App\Entity\Product\ProductAssociationTypeTranslation

sylius_promotion:
    resources:
        promotion:
            classes:
                model: App\Entity\Promotion\Promotion
        promotion_rule:
            classes:
                model: App\Entity\Promotion\PromotionRule
        promotion_action:
            classes:
                model: App\Entity\Promotion\PromotionAction
        promotion_coupon:
            classes:
                model: App\Entity\Promotion\PromotionCoupon

sylius_review:
    resources:
        product:
            review:
                classes:
                    model: App\Entity\Product\ProductReview

sylius_shipping:
    resources:
        shipment:
            classes:
                model: App\Entity\Shipping\Shipment
        shipping_method:
            classes:
                model: App\Entity\Shipping\ShippingMethod
            translation:
                classes:
                    model: App\Entity\Shipping\ShippingMethodTranslation
        shipping_category:
            classes:
                model: App\Entity\Shipping\ShippingCategory

sylius_taxation:
    resources:
        tax_category:
            classes:
                model: App\Entity\Taxation\TaxCategory
        tax_rate:
            classes:
                model: App\Entity\Taxation\TaxRate

sylius_taxonomy:
    resources:
        taxon:
            classes:
                model: App\Entity\Taxonomy\Taxon
            translation:
                classes:
                    model: App\Entity\Taxonomy\TaxonTranslation
sylius_user:
    resources:
        admin:
            user:
                classes:
                    model: App\Entity\User\AdminUser
        shop:
            user:
                classes:
                    model: App\Entity\User\ShopUser
        oauth:
            user:
                classes:
                    model: App\Entity\User\UserOAuth

sylius_shop:
    product_grid:
        include_all_descendants: true

sylius_theme:
    sources:
        filesystem:
            scan_depth: 1
            directories:
                - "%kernel.project_dir%/themes"

sylius_api:
    enabled: true
    

#APP
sylius_grid:
    templates:
            action:
                # upload_images: "@App/admin/Grid/Action/button_images.html.twig"
                duplicate: "@App/admin/Grid/Action/button_duplicate.html.twig"
                validate: "@App/admin/Grid/Action/button_validate.html.twig"


    grids:        
        app_admin_web_page:
            driver:
                name: doctrine/orm
                options:
                    class: App\Entity\WebPage

            fields:
                is_locked:
                    type: twig
                    label: app.ui_element.field.is_locked
                    options:
                        template: "@App/admin/Grid/Field/locked.html.twig"
                        
                is_enabled:
                    type: twig
                    label: sylius.ui.is_enabled
                    options:
                        template: "@SyliusUi/Grid/Field/enabled.html.twig"

                primaryImage:
                    type: twig
                    label: app.ui.primary_image
                    options:
                        template: "@App/admin/Grid/Field/thumbnail.html.twig"

                category:
                    type: twig # Type of filter
                    label: app.ui.category
                    options:
                        template:  "@App/admin/Grid/Field/rawLabel.html.twig"

                translation.headline:
                    type: string
                    label: app.ui.headline
                    sortable: translation.name

                updatedAt:
                    type: datetime
                    label: app.ui.updatedAt

            filters:
                search:
                    type: string
                    label: false
                    options:
                        fields: [ translations.headline ]
                    form_options:
                        type: contains
     
                category:
                    type: entity
                    label: false
                    options:
                        fields: [ category ]
                    form_options:
                        class: "%app.model.category.class%"  

                isEnabled:
                    type: boolean # Type of filter
                    label: app.ui_element.field.status
                    enabled: true
                    # template: ~
                    position: 100
                    options:
                        field: isEnabled
                    form_options: { }
                    default_value: ~

                updatedAt:
                    type: date # Type of filter
                    label: app.ui_element.field.updatedAt
                    enabled: true
                    # template: ~
                    position: 100
                    options:
                        field: updatedAt
                    form_options: { }
                    default_value: ~

            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete

        app_admin_landing_page:
            driver:
                name: doctrine/orm
                options:
                    class: App\Entity\WebPage
                    repository:
                        method: createQueryBuilderByTypeLandingPage
                        arguments:
                            parameters: '%configuration_project%'
            fields:
                is_enabled:
                    type: twig
                    label: sylius.ui.is_enabled
                    options:
                        template: "@SyliusUi/Grid/Field/enabled.html.twig"

                primaryImage:
                    type: twig
                    label: app.ui.primary_image
                    options:
                        template: "@App/admin/Grid/Field/thumbnail.html.twig"

                category:
                    type: twig # Type of filter
                    label: app.ui.category
                    options:
                        template:  "@App/admin/Grid/Field/rawLabel.html.twig"

                translation.headline:
                    type: string
                    label: app.ui.headline
                    sortable: translation.name

                updatedAt:
                    type: datetime
                    label: app.ui.updatedAt

        app_admin_component:
            driver:
                name: doctrine/orm
                options:
                    class: App\Entity\Component
            fields:
                is_enabled:
                    type: twig
                    label: sylius.ui.is_enabled
                    options:
                        template: "@SyliusUi/Grid/Field/enabled.html.twig"
                is_locked:
                    type: twig
                    label: app.ui_element.field.is_locked
                    options:
                        template: "@App/admin/Grid/Field/locked.html.twig"
                name:
                    type: string
                    label: sylius.ui.name
                    sortable: translation.name
    
            filters:
                search:
                    type: string
                    label: false
                    options:
                        fields: [name]
                    form_options:
                        type: contains   
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete

        app_admin_cms_component:
            driver:
