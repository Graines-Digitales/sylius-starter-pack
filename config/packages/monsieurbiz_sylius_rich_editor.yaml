monsieurbiz_sylius_richeditor:
    upload_directory: '/media/image'
    image_upload_directory: '/media/image'
    
    ui_elements:
        #Element monsieurbiz désactivés
        monsieurbiz.youtube:
            enabled: false
        monsieurbiz.html:
            enabled: false
        monsieurbiz.text:
            enabled: false   
        monsieurbiz.title:
            enabled: false  
        monsieurbiz.h1:
            enabled: false
        monsieurbiz.h2:
            enabled: false
        monsieurbiz.h3:
            enabled: false   
        monsieurbiz.image:
            enabled: false  
        monsieurbiz.quote:
            enabled: false
        monsieurbiz.video:
            enabled: false
        monsieurbiz.separator:
            enabled: false   
        monsieurbiz.button:
            enabled: false  
        monsieurbiz.image_collection:
            enabled: false

        #Element custom
        app.component_icon:
            title: 'app.ui_element.component_icon.title'
            description: 'app.ui_element.component_icon.description'
            icon: thumbtack
            classes:
                form: App\Form\Type\UiElement\ComponentIconType
                #ui_element: App\UiElement\MyUiElement
            templates:
                admin_render: '@App/admin/UiElement/component_icon.html.twig'
                front_render: '/shop/UiElement/component_image.html.twig'
            tags: [] 
