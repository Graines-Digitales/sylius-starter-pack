monsieurbiz_sylius_richeditor:
    upload_directory: '/media/image'
    image_upload_directory: '/media/image'
    
    ui_elements:
        #Element monsieurbiz désactivés
        monsieurbiz.youtube:
            enabled: true
        monsieurbiz.html:
            enabled: false
        monsieurbiz.text:
            enabled: true   
        monsieurbiz.title:
            enabled: false  
        monsieurbiz.h1:
            enabled: false
        monsieurbiz.h2:
            enabled: true
        monsieurbiz.h3:
            enabled: false   
        monsieurbiz.image:
            enabled: false  
        monsieurbiz.quote:
            enabled: true
        monsieurbiz.video:
            enabled: false
        monsieurbiz.separator:
            enabled: false   
        monsieurbiz.button:
            enabled: false  
        monsieurbiz.image_collection:
            enabled: false

        #Element custom
        app.component_icon:
            title: 'app.ui_element.component_icon.title'
            description: 'app.ui_element.component_icon.description'
            icon: list alternate outline
            classes:
                form: App\Form\Type\UiElement\ComponentIconType
                #ui_element: App\UiElement\MyUiElement
            templates:
                admin_render: '@App/admin/UiElement/component_icon.html.twig'
                front_render: '/shop/UiElement/component_icon.html.twig'
            tags: [] 
        app.component_image:
            title: 'app.ui_element.component_image.title'
            description: 'app.ui_element.component_image.description'
            icon: list alternate outline
            classes:
                form: App\Form\Type\UiElement\ComponentImageType
                #ui_element: App\UiElement\MyUiElement
            templates:
                admin_render: '@App/admin/UiElement/component_image.html.twig'
                front_render: '/shop/UiElement/component_image.html.twig'
            tags: [] 
        app.component_images:
            title: 'app.ui_element.component_images.title'
            description: 'app.ui_element.component_images.description'
            icon: list alternate outline
            classes:
                form: App\Form\Type\UiElement\ComponentImagesType
                #ui_element: App\UiElement\MyUiElement
            templates:
                admin_render: '@App/admin/UiElement/component_images.html.twig'
                front_render: '/shop/UiElement/component_images.html.twig'
            tags: []  
        app.component_cards:
            title: 'app.ui_element.component_cards.title'
            description: 'app.ui_element.component_cards.description'
            icon: list alternate outline
            classes:
                form: App\Form\Type\UiElement\ComponentCardsType
                #ui_element: App\UiElement\MyUiElement
            templates:
                admin_render: '@App/admin/UiElement/component_cards.html.twig'
                front_render: '/shop/UiElement/component_cards.html.twig'
            tags: []  
        app.component_card:
            alias: app.ui_element.component_card.alias
            # section: 'app.ui_element.component_card.section'
            title: 'app.ui_element.component_card.title'
            description: 'app.ui_element.component_card.description'
            icon: clone outline
            classes:
                form: App\Form\Type\UiElement\ComponentCardType
                # ui_element: App\UiElement\TestUiElement
            templates:
                admin_render: '@App/admin/UiElement/component_card.html.twig'
                front_render: '/shop/UiElement/component_card.html.twig'
            tags: []
        app.component_call_to_action:
            title: 'app.ui_element.component_call_to_action.title'
            description: 'app.ui_element.component_call_to_action.description'
            icon: address card outline
            classes:
