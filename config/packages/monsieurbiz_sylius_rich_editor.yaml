        app.component_iframe:
            title: 'app.ui_element.component_iframe.title'
            description: 'app.ui_element.component_iframe.description'
            icon: code
            classes:
                form: App\Form\Type\UiElement\ComponentIframeType
                #ui_element: App\UiElement\MyUiElement
            templates:
                admin_render: '@App/admin/UiElement/component_iframe.html.twig'
                front_render: '/app/UiElement/component_iframe.html.twig'
            tags: []
