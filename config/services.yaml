parameters:
    locale: 'fr'

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
imports:
    - { resource: parameters.yaml }
       
services:
    # Default configuration for services in *this* file
    _defaults:
        # Automatically injects dependencies in your services
        autowire: true

        # Automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true

        # Allows optimizing the container by removing unused services; this also means
        # fetching services directly from the container via $container->get() won't work
        public: false

    _instanceof:
        Sylius\Bundle\ResourceBundle\Controller\ResourceController:
            autowire: false
        Sylius\Bundle\ResourceBundle\Form\Type\AbstractResourceType:
            autowire: false

    redis_connection_factory:
        class: Enqueue\Redis\RedisConnectionFactory
        
    # Makes classes in src/ available to be used as services;
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/*'
        # exclude: '../src/{Entity,Migrations,Tests,Kernel.php}'
        exclude: '../src/{Migrations,Tests,Kernel.php}'

    # Controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    app.form.extension.type.admin:
        class: App\Form\Extension\AdminUserTypeExtension
        tags:
            - { name: form.type_extension, extended_type: Sylius\Bundle\CustomerBundle\Form\Type\AdminUserType }

    app.controller.nuxt:
        class: App\Controller\Web\NuxtController
        autowire: true
        tags: ['controller.service_arguments']

    app.controller.schema:
        class: App\Controller\Web\SchemaController
        autowire: true
        tags: ['controller.service_arguments']
    
    App\EventListener\ArticleListener:
        tags:
            - { name: doctrine.event_listener, event: prePersist }
            - { name: doctrine.event_listener, event: preUpdate }

    App\EventListener\TripListener:
        tags:
            - { name: doctrine.event_listener, event: prePersist }
            - { name: doctrine.event_listener, event: preUpdate }

    App\EventListener\WebPageListener:
        tags:
            - { name: doctrine.event_listener, event: prePersist }
            - { name: doctrine.event_listener, event: preUpdate }

    App\EventListener\CategoryListener:
        tags:
            - { name: doctrine.event_listener, event: preUpdate }

    App\EventListener\MediaObjectImageListener:
        tags:
            - { name: doctrine.event_listener, event: prePersist }
            - { name: doctrine.event_listener, event: preUpdate }
            - { name: doctrine.event_listener, event: postRemove }
    
    App\EventListener\MediaObjectIconListener:
        tags:
            - { name: doctrine.event_listener, event: prePersist }
            - { name: doctrine.event_listener, event: preUpdate }

    App\EventListener\MediaObjectDocumentListener:
        tags:
            - { name: doctrine.event_listener, event: prePersist }
            - { name: doctrine.event_listener, event: preUpdate }

    App\EventListener\ComponentListener:
        tags:
            - { name: doctrine.event_listener, event: prePersist }
            - { name: doctrine.event_listener, event: preUpdate }

     # Menu Listener
    app.listener.admin.menu_builder:
        class: App\EventListener\AdminMenuListener
        tags:
            - { name: kernel.event_listener, event: sylius.menu.admin.main, method: addAdminMenuItems }
            - { name: kernel.event_listener, event: sylius.menu.admin.main, method: reorderMenu, priority: -256 }
        # arguments: [ '@service_container' ]

    # Forms
    app.web_page.form.type:
        class: App\Form\Type\WebPageType
        tags:
            - { name: form.type }
        arguments: ['@doctrine.orm.default_entity_manager', '%app.model.web_page.class%', ['sylius']]

    app.web_page_translation.form.type:
        class: App\Form\Type\WebPageTranslationType
        tags:
            - { name: form.type }
        arguments: ['%app.model.web_page_translation.class%', ['sylius']]

    app.landing_page.form.type:
        class: App\Form\Type\LandingPageType
        tags:
            - { name: form.type }
        arguments: ['@service_container', '@doctrine.orm.default_entity_manager', '%app.model.web_page.class%', ['sylius']]

    app.landing_page_translation.form.type:
        class: App\Form\Type\LandingPageTranslationType
        tags:
            - { name: form.type }
        arguments: ['%app.model.web_page_translation.class%', ['sylius']]

    app.special_announcement.form.type:
        class: App\Form\Type\SpecialAnnouncementType
        tags:
            - { name: form.type }
        arguments: ['@service_container', '%app.model.special_announcement.class%', ['sylius']]

    app.special_announcement_translation.form.type:
        class: App\Form\Type\SpecialAnnouncementTranslationType
        tags:
            - { name: form.type }
        arguments: ['%app.model.special_announcement_translation.class%', ['sylius']]

    app.component.form.type:
