        arguments: ['@service_container', '@doctrine.orm.default_entity_manager', '%app.model.cms_link.class%', ['sylius']]

    app.cms_link_translation.form.type:
        class: App\Form\Type\CmsLinkTranslationType
        tags:
            - { name: form.type }
        arguments: ['%app.model.cms_link_translation.class%', ['sylius']]

    # Override LandingPageController
    sylius.controller.shop.homepage:
        class: App\Controller\Shop\HomepageController
        autowire: true
        tags: ['controller.service_arguments']

    Liip\ImagineBundle\Service\FilterService:
        alias: 'liip_imagine.service.filter'
