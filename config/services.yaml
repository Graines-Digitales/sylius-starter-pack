        arguments: [ '@doctrine.orm.default_entity_manager', '%app.model.organization.class%', ['sylius']]

    app.cms_menu.form.type:
        class: App\Form\Type\CmsMenuType
        tags:
            - { name: form.type }
        arguments: ['@service_container', '%app.model.cms_menu.class%', ['sylius']]
    
    app.cms_link.form.type:
        class: App\Form\Type\CmsLinkType
        tags:
